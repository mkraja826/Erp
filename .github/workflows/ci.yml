name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Next build
        run: npm run build
      - name: Cloudflare bundle build
        run: npm run build:cloudflare

  browser-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://nfgmtcfaaqfiukdxtkwy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MXQsC9Cv67uaCxZa25HsoQ_xDYDegE9
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_LEARNER_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
      E2E_LEARNER_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Provision confirmed E2E learner
        run: node scripts/provision-e2e-learner.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical journey smoke tests
        run: npm run test:e2e
